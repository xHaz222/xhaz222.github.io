<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Outer con nieve · xatframe</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101a32;color:#fff;font:14px system-ui,sans-serif}
#photo,#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#photo{object-fit:cover}#photo.contain{object-fit:contain}
#snow{overflow:hidden}
.flake{position:absolute;left:var(--x);top:-18px;color:#edf7ff;text-shadow:0 0 6px #79b4ff;font-size:var(--size);opacity:var(--opacity);animation:fall var(--time) var(--delay) linear infinite}
@keyframes fall{to{transform:translate(var(--drift),calc(100vh + 24px)) rotate(180deg)}}
#toggle{position:fixed;right:12px;bottom:12px;color:#fff;background:#182346e8;border:1px solid #a8c9f788;border-radius:999px;padding:7px 11px;cursor:pointer}
#snow[hidden],#photo[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.flake{animation:none;transform:translateY(var(--rest))}}
</style>
</head>
<body>
<img id="photo" hidden alt="" referrerpolicy="no-referrer">
<div id="snow" aria-hidden="true"></div>
<button id="toggle" type="button" aria-pressed="true">Nieve</button>
<script>
const query = new URLSearchParams(location.search);
const english = query.get('lang') === 'en';
document.documentElement.lang = english ? 'en' : 'es';
const byId = id => document.getElementById(id);
try {
  const url = new URL(query.get('bg'));
  if (url.protocol === 'https:' && !url.username && !url.password) {
    const photo = byId('photo');
    photo.classList.toggle('contain', query.get('fit') === 'contain');
    photo.addEventListener('load', () => { photo.hidden = false; });
    photo.addEventListener('error', () => { photo.hidden = true; });
    photo.src = url.href;
  }
} catch {}
const snow = byId('snow'), toggle = byId('toggle');
let enabled = query.get('snow') !== '0';
const density = query.get('density') === 'high' ? 60 : query.get('density') === 'low' ? 18 : 36;
for (let i = 0; i < density; i++) {
  const flake = document.createElement('span');
  flake.className = 'flake';
  flake.textContent = i % 5 ? '·' : '❄';
  const props = { x: (i * 47.37 % 100) + '%', size: (7 + i * 3 % 13) + 'px', opacity: .32 + (i % 6) * .1,
    time: (9 + i * 7 % 15) + 's', delay: -(i * 1.79 % 21) + 's', drift: (i * 23 % 88 - 44) + 'px', rest: (i * 37 % 98 + 3) + 'vh' };
  for (const [key, value] of Object.entries(props)) flake.style.setProperty('--' + key, value);
  snow.append(flake);
}
function sync() {
  toggle.setAttribute('aria-pressed', String(enabled));
  toggle.textContent = english ? (enabled ? 'Snow on' : 'Snow off') : (enabled ? 'Nieve activa' : 'Nieve apagada');
  snow.hidden = !enabled;
}
toggle.addEventListener('click', () => { enabled = !enabled; sync(); });
sync();
</script>
</body>
</html>
