<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aesthetic · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Aesthetic — xatframe. ?p= colores, ?boton=0 oculta el botón de color */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const EN = Q.get('lang') ? Q.get('lang') === 'en' : !/^es\b/i.test(navigator.language || 'es'), L = (es, en) => EN ? en : es; document.documentElement.lang = EN ? 'en' : 'es';
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const c = $('#c'), x = c.getContext('2d'); let W = 0, H = 0, DPR = 1;
let P, PK;
const PAL = {
  rosa: { a: '#f9d9e5', b: '#e9d4f5', c: '#fff1f5', s: '#ffffff', k: '#e58fb0', g: .05 },
  lila: { a: '#e3dcff', b: '#d4ecff', c: '#f6f2ff', s: '#ffffff', k: '#9d8fe5', g: .05 },
  sepia: { a: '#efe3d2', b: '#e2cdb5', c: '#f8f0e5', s: '#fffaf2', k: '#b08a6a', g: .07 },
  noche: { a: '#1d1830', b: '#2c1f3d', c: '#3a2747', s: '#ffd6ea', k: '#ff9cc8', g: .06 }
};
const NZ = document.createElement('canvas'); NZ.width = NZ.height = 140; { const g = NZ.getContext('2d'), d = g.createImageData(140, 140); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
let noise, sp = [], bf = [], gx = 0, gy = 0, gt = 0;
function rsHook() {
  noise = x.createPattern(NZ, 'repeat');
  sp = Array.from({ length: Math.round(W * H / 22000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: rnd(5, 13), p: Math.random() * TAU, v: rnd(4, 12), h: Math.random() < .22, k: Math.random() < .5 }));
  bf = [[.1, .3], [.88, .25], [.12, .72], [.9, .7]].map(([u, v], i) => ({ u, v, p: i * 1.7, s: rnd(.8, 1.2) }));
}
function spark(cx, cy, r) { x.beginPath(); x.moveTo(cx, cy - r); x.quadraticCurveTo(cx, cy, cx + r, cy); x.quadraticCurveTo(cx, cy, cx, cy + r); x.quadraticCurveTo(cx, cy, cx - r, cy); x.quadraticCurveTo(cx, cy, cx, cy - r); x.fill(); }
function heart(cx, cy, r) { x.beginPath(); x.moveTo(cx, cy + r * .9); x.bezierCurveTo(cx - r * 1.4, cy - r * .2, cx - r * .6, cy - r * 1.2, cx, cy - r * .4); x.bezierCurveTo(cx + r * .6, cy - r * 1.2, cx + r * 1.4, cy - r * .2, cx, cy + r * .9); x.stroke(); }
function fly(b, t) {
  const cx = W * b.u + Math.sin(t * .23 + b.p) * W * .04, cy = H * b.v + Math.sin(t * .31 + b.p * 2) * H * .05, s = Math.min(W, H) * .05 * b.s, f = .25 + .75 * Math.abs(Math.sin(t * 2.4 + b.p));
  x.save(); x.translate(cx, cy); x.rotate(Math.sin(t * .4 + b.p) * .25); x.fillStyle = rgba(P.k, .35); x.strokeStyle = rgba(P.k, .9); x.lineWidth = 1.4;
  for (const sd of [-1, 1]) { x.save(); x.scale(sd * f, 1); x.beginPath(); x.ellipse(s * .55, -s * .35, s * .6, s * .45, -.5, 0, TAU); x.fill(); x.stroke(); x.beginPath(); x.ellipse(s * .45, s * .35, s * .4, s * .32, .5, 0, TAU); x.fill(); x.stroke(); x.restore(); }
  x.fillStyle = rgba(P.k, .9); x.fillRect(-1, -s * .5, 2, s); x.restore();
}
function frame(t, dt) {
  let g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, P.a); g.addColorStop(.5 + .2 * Math.sin(t * .05), P.c); g.addColorStop(1, P.b); x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (const [u, v, ph] of [[.05, .1, 0], [.95, .9, 2]]) { const r = x.createRadialGradient(W * u, H * v, 0, W * u, H * v, Math.max(W, H) * .45); r.addColorStop(0, rgba(P.s, .45 + .1 * Math.sin(t * .2 + ph))); r.addColorStop(1, rgba(P.s, 0)); x.fillStyle = r; x.fillRect(0, 0, W, H); }
  for (const s of sp) {
    s.y -= s.v * dt; if (s.y < -20) { s.y = H + 20; s.x = Math.random() * W; }
    const k = .6 + .4 * Math.sin(t * 1.3 + s.p); x.globalAlpha = .35 + .5 * k;
    if (s.h) { x.strokeStyle = P.k; x.lineWidth = 1.5; heart(s.x, s.y, s.r * .8); } else { x.fillStyle = s.k ? P.k : P.s; x.shadowColor = rgba(P.k, .6); x.shadowBlur = 8; spark(s.x, s.y, s.r * k); x.shadowBlur = 0; }
  } x.globalAlpha = 1;
  for (const b of bf) fly(b, t);
  gt += dt; if (gt > .09) { gt = 0; gx = Math.random() * 140; gy = Math.random() * 140; }
  x.save(); x.globalAlpha = P.g; x.translate(-gx, -gy); x.fillStyle = noise; x.fillRect(0, 0, W + 140, H + 140); x.restore(); x.globalAlpha = 1;
}
function setPal(k) { PK = k; P = PAL[k]; if (typeof palHook === 'function') palHook(); }
const P0 = PAL[Q.get('p')] ? Q.get('p') : 'rosa'; setPal(P0);
function rs() { DPR = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0); if (typeof rsHook === 'function') rsHook(); }
addEventListener('resize', rs); rs();
let last = performance.now();
(function loop(t) { const dt = Math.min(50, t - last) / 1000; last = t; if (!document.hidden) frame(t / 1000, dt); requestAnimationFrame(loop); })(last);
</script>
<script>var SW = { pal: PAL, cur: P0, set: setPal, dots: k => [PAL[k].a, PAL[k].k, PAL[k].b], names: EN ? {"rosa": "pink", "lila": "lilac", "sepia": "sepia", "noche": "night"} : {} };</script>
<button class="swc" id="swc" type="button" aria-label="Cambiar color"><span></span></button><div class="swn" id="swn"></div>
<style>
.swc{position:fixed;right:14px;bottom:14px;z-index:60;width:30px;height:30px;padding:3px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;opacity:.6;transition:opacity .25s,transform .4s}
.swc:hover{opacity:1;transform:rotate(120deg)}
.swc span{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--sw1),var(--sw2),var(--sw3),var(--sw1))}
.swn{position:fixed;right:52px;bottom:19px;z-index:60;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.4);opacity:0;transform:translateX(6px);transition:all .3s;pointer-events:none}
.swn.on{opacity:1;transform:none}
</style>
<script>
/* botón de color: cada visitante puede cambiar los colores solo en su pantalla (no se guarda nada) */
(function () {
  const Q = new URLSearchParams(location.search), b = document.getElementById('swc'), n = document.getElementById('swn');
  if (Q.get('boton') === '0') { b.remove(); n.remove(); return; }
  const L = Object.keys(SW.pal); let i = Math.max(0, L.indexOf(SW.cur)), t;
  const dot = k => { const c = SW.dots(k);['--sw1', '--sw2', '--sw3'].forEach((v, j) => b.style.setProperty(v, c[j % c.length])); };
  dot(L[(i + 1) % L.length]);
  b.addEventListener('click', e => {
    e.stopPropagation(); i = (i + 1) % L.length; SW.set(L[i]); dot(L[(i + 1) % L.length]);
    n.textContent = SW.names && SW.names[L[i]] || L[i]; n.classList.add('on'); clearTimeout(t); t = setTimeout(() => n.classList.remove('on'), 1400);
  });
  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
})();
</script>
</body>
</html>
