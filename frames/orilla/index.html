<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orilla · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Orilla — xatframe. ?p= colores, ?boton=0 oculta el botón de color */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

</style>
<style>.sig{font:500 9px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:#fff;opacity:.32;mix-blend-mode:difference;pointer-events:none;white-space:nowrap;z-index:55}.sig.fx{position:fixed;left:16px;bottom:12px}.sig.fr{position:fixed;right:56px;bottom:22px;left:auto}.sig.in{position:absolute;left:0;right:0;bottom:-22px;text-align:center}</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const EN = Q.get('lang') ? Q.get('lang') === 'en' : !/^es\b/i.test(navigator.language || 'es'), L = (es, en) => EN ? en : es; document.documentElement.lang = EN ? 'en' : 'es';
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const c = $('#c'), x = c.getContext('2d'); let W = 0, H = 0, DPR = 1;
let P, PK;
const NP = new Uint8Array(512); { const p = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.random() * (i + 1) | 0;[p[i], p[j]] = [p[j], p[i]]; } for (let i = 0; i < 512; i++) NP[i] = p[i & 255]; }
const fade = t => t * t * (3 - 2 * t), lerp = (a, b, t) => a + (b - a) * t;
function n3(xx, yy, zz) {
  const X = Math.floor(xx) & 255, Y = Math.floor(yy) & 255, Z = Math.floor(zz) & 255; xx -= Math.floor(xx); yy -= Math.floor(yy); zz -= Math.floor(zz);
  const u = fade(xx), v = fade(yy), w = fade(zz), h = (a, b, c) => NP[NP[NP[a] + b] + c] / 255;
  return lerp(lerp(lerp(h(X, Y, Z), h(X + 1, Y, Z), u), lerp(h(X, Y + 1, Z), h(X + 1, Y + 1, Z), u), v), lerp(lerp(h(X, Y, Z + 1), h(X + 1, Y, Z + 1), u), lerp(h(X, Y + 1, Z + 1), h(X + 1, Y + 1, Z + 1), u), v), w);
}

const PAL = {
  negro: { s1: '#0a0a0b', s2: '#141415', w1: '#6d7275', w2: '#2a2d30', f: '#f4f4f2' },
  arena: { s1: '#cdb89a', s2: '#bfa784', w1: '#2f8f95', w2: '#14525f', f: '#ffffff' },
  noche: { s1: '#0a0d14', s2: '#121826', w1: '#2a3b57', w2: '#111a2b', f: '#dfe8f5' }
};
const GN = document.createElement('canvas'); GN.width = GN.height = 120; { const g = GN.getContext('2d'), d = g.createImageData(120, 120); for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }
let grain;
function rsHook() { grain = x.createPattern(GN, 'repeat'); }
// la orilla cruza la pantalla en diagonal: el mar arriba a la izquierda, la arena abajo a la derecha
const shore = (s, t) => { const yy = s * H * 1.2 - H * .1; return [W * .18 + s * W * .7 + Math.sin(s * 9 + t * .1) * W * .012, yy]; };
function edge(off, t, k, amp) { const pts = []; for (let i = 0; i <= 80; i++) { const s = i / 80, [sx, sy] = shore(s, t); const n = (n3(s * 6, k * 3.1, t * .15) - .5) * amp; pts.push([sx - off * .78 + n * .78, sy + off * .62 - n * .62]); } return pts; }
function frame(t) {
  x.fillStyle = P.s1; x.fillRect(0, 0, W, H);
  // mar
  const sea = edge(0, t, 0, 0); x.beginPath(); x.moveTo(0, 0); x.lineTo(sea[0][0], sea[0][1]); sea.forEach(p => x.lineTo(p[0], p[1])); x.lineTo(0, H); x.closePath();
  let g = x.createLinearGradient(0, 0, W * .6, H * .5); g.addColorStop(0, P.w2); g.addColorStop(1, P.w1); x.fillStyle = g; x.fill();
  // olas que llegan, rompen y se retiran
  for (let k = 0; k < 4; k++) {
    const ph = (t * .055 + k / 4) % 1, reach = ph < .8 ? (1 - ph / .8) : -(ph - .8) / .2 * .35, off = reach * W * .3, a = ph < .8 ? Math.min(1, ph * 3) * .85 : (1 - (ph - .8) / .2) * .7;
    const fr = edge(off, t, k + 1, W * .03), bw = W * (.012 + .02 * Math.max(0, 1 - Math.abs(ph - .6) * 3)), bk = edge(off + bw, t, k + 1.5, W * .045);
    const poly = (A, B) => { x.beginPath(); A.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); for (let i = B.length - 1; i >= 0; i--) x.lineTo(B[i][0], B[i][1]); x.closePath(); };
    poly(fr, bk); x.fillStyle = rgba(P.f, a * .55); x.fill();
    const bk2 = edge(off + bw * 3.5, t, k + 2.2, W * .06); poly(bk, bk2); x.fillStyle = rgba(P.f, a * .14); x.fill();
    x.strokeStyle = rgba(P.f, a); x.lineWidth = 2; x.beginPath(); fr.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke();
    for (let j = 1; j < 6; j++) { const ln = edge(off + bw * (1 + j * .7), t + j * .3, k + 3 + j * .37, W * .05); x.strokeStyle = rgba(P.f, a * .3 / j); x.lineWidth = 1; x.setLineDash([rnd(20, 60), rnd(6, 20)]); x.beginPath(); ln.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); x.stroke(); }
    x.setLineDash([]);
    // brillo de arena mojada
    if (ph >= .8) { x.beginPath(); fr.forEach((p, i) => i ? x.lineTo(p[0], p[1]) : x.moveTo(p[0], p[1])); for (let i = sea.length - 1; i >= 0; i--) x.lineTo(sea[i][0], sea[i][1]); x.closePath(); x.fillStyle = rgba(P.f, .05 * a); x.fill(); }
  }
  x.save(); x.globalAlpha = .07; x.fillStyle = grain; x.fillRect(0, 0, W, H); x.restore();
  g = x.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.45)'); x.fillStyle = g; x.fillRect(0, 0, W, H);
}
function setPal(k) { PK = k; P = PAL[k]; if (typeof palHook === 'function') palHook(); }
const P0 = PAL[Q.get('p')] ? Q.get('p') : 'negro'; setPal(P0);
function rs() { DPR = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0); if (typeof rsHook === 'function') rsHook(); }
addEventListener('resize', rs); rs();
let last = performance.now();
(function loop(t) { const dt = Math.min(50, t - last) / 1000; last = t; if (!document.hidden) frame(t / 1000, dt); requestAnimationFrame(loop); })(last);
</script>
<script>var SW = { pal: PAL, cur: P0, set: setPal, dots: k => [PAL[k].s1, PAL[k].f, PAL[k].w1], names: EN ? {"negro": "black & white", "arena": "sand", "noche": "night"} : {"negro": "blanco y negro"} };</script>
<button class="swc" id="swc" type="button" aria-label="Cambiar color"><span></span></button><div class="swn" id="swn"></div>
<style>
.swc{position:fixed;right:14px;bottom:14px;z-index:60;width:30px;height:30px;padding:3px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;opacity:.6;transition:opacity .25s,transform .4s}
.swc:hover{opacity:1;transform:rotate(120deg)}
.swc span{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--sw1),var(--sw2),var(--sw3),var(--sw1))}
.swn{position:fixed;right:52px;bottom:19px;z-index:60;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.4);opacity:0;transform:translateX(6px);transition:all .3s;pointer-events:none}
.swn.on{opacity:1;transform:none}
</style>
<script>
/* botón de color: cada visitante puede cambiar los colores solo en su pantalla (no se guarda nada) */
(function () {
  const Q = new URLSearchParams(location.search), b = document.getElementById('swc'), n = document.getElementById('swn');
  if (Q.get('boton') === '0') { b.remove(); n.remove(); return; }
  const L = Object.keys(SW.pal); let i = Math.max(0, L.indexOf(SW.cur)), t;
  const dot = k => { const c = SW.dots(k);['--sw1', '--sw2', '--sw3'].forEach((v, j) => b.style.setProperty(v, c[j % c.length])); };
  dot(L[(i + 1) % L.length]);
  b.addEventListener('click', e => {
    e.stopPropagation(); i = (i + 1) % L.length; SW.set(L[i]); dot(L[(i + 1) % L.length]);
    n.textContent = SW.names && SW.names[L[i]] || L[i]; n.classList.add('on'); clearTimeout(t); t = setTimeout(() => n.classList.remove('on'), 1400);
  });
  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
})();
</script>
<div class="sig fx">xHaz Frame Design</div>
</body>
</html>
