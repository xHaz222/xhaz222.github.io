<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Primavera · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Primavera — xatframe libre para tu sala (autor: xHaz 1004002)
   Link: ?t=Título&s=Subtítulo */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',system-ui,sans-serif;user-select:none;-webkit-user-select:none;background:#f6e6ec}
.sky{position:fixed;inset:0;background:radial-gradient(70% 60% at 50% 0%,#fff7f4 0%,transparent 70%),linear-gradient(180deg,#fbeef0 0%,#f2d9e2 55%,#e6c2d2 100%)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.deco{position:fixed;pointer-events:none}
.title{position:fixed;left:3vw;bottom:5vh;color:#6b2f4a;text-shadow:0 2px 16px rgba(255,255,255,.6);pointer-events:none;z-index:3}
.title b{display:block;font-family:'Outfit',system-ui,sans-serif;font-weight:300;letter-spacing:.02em;font-size:clamp(26px,3.2vw,50px);line-height:1}
.title span{display:block;margin-top:10px;font-family:'JetBrains Mono',monospace;font-size:clamp(10px,.8vw,12px);letter-spacing:.22em;text-transform:uppercase;color:#b0708c}
.br{top:-2vh;width:min(34vw,520px)}
.br.l{left:-3vw}.br.r{right:-3vw;transform:scaleX(-1)}
.br .bl{transform-box:fill-box;transform-origin:center;animation:bl 4s ease-in-out infinite}
@keyframes bl{50%{transform:scale(1.08)}}
@media (max-width:640px){.title{bottom:3vh}}
</style>
</head>
<body>
<div class="sky"></div>

<canvas id="c"></canvas>
<svg class="deco br l" id="brL" viewBox="0 0 520 360"></svg><svg class="deco br r" id="brR" viewBox="0 0 520 360"></svg>
<div class="title"><b id="tt">Primavera</b><span id="ts">florecer juntos</span></div>
<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const clean = s => String(s || '').replace(/[<>]/g, '').slice(0, 40);
$('#tt').textContent = clean(Q.get('t')); $('#ts').textContent = clean(Q.get('s'));
if (!Q.get('t') && !Q.get('s')) $('.title').remove();
const cv = $('#c'), x = cv.getContext('2d'); let W, H, P = [];
const rnd = (a, b) => a + Math.random() * (b - a);
function size() { const d = Math.min(devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; x.setTransform(d, 0, 0, d, 0, 0); init(); }
const PC = ['#f7c6d6', '#f4b3c8', '#fbd9e4', '#ffffff', '#efa9bf'];
(function () {
  const branch = '<path d="M-10 40C80 60 150 50 230 90S360 150 470 140" stroke="#5a3a3a" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M180 72C200 30 240 18 280 20M300 118C320 170 360 190 400 196M120 56C120 100 140 130 170 150" stroke="#5a3a3a" stroke-width="5" fill="none" stroke-linecap="round"/>';
  const spots = [[60, 44], [110, 60], [160, 58], [205, 74], [245, 24], [280, 22], [255, 98], [300, 116], [340, 132], [380, 192], [405, 196], [430, 142], [470, 140], [165, 148], [140, 112]];
  const fl = spots.map(([cx, cy], i) => { const s = 8 + (i % 3) * 3; let p = ''; for (let k = 0; k < 5; k++) { const a = k * 72 * Math.PI / 180; p += `<ellipse cx="${(cx + Math.cos(a) * s * .6).toFixed(1)}" cy="${(cy + Math.sin(a) * s * .6).toFixed(1)}" rx="${s * .55}" ry="${s * .38}" transform="rotate(${k * 72 + 90} ${(cx + Math.cos(a) * s * .6).toFixed(1)} ${(cy + Math.sin(a) * s * .6).toFixed(1)})" fill="${PC[(i + k) % PC.length]}"/>`; } return `<g class="bl" style="animation-delay:${-i * .37}s">${p}<circle cx="${cx}" cy="${cy}" r="${s * .22}" fill="#d9707f"/></g>`; }).join('');
  $('#brL').innerHTML = branch + fl; $('#brR').innerHTML = branch + fl;
})();
function init() { P = Array.from({ length: Math.round(Math.min(80, W * H / 20000)) }, () => mk(true)); }
function mk(any) { return { x: rnd(-50, W), y: any ? rnd(0, H) : -15, s: rnd(4, 8), vy: rnd(.35, .9), vx: rnd(.2, .7), r: rnd(0, 6.28), vr: rnd(-.04, .04), ph: rnd(0, 6.28), c: PC[Math.random() * PC.length | 0] }; }
function frame() {
  for (const p of P) {
    p.ph += .025; p.y += p.vy; p.x += p.vx + Math.sin(p.ph) * .6; p.r += p.vr;
    if (p.y > H + 20 || p.x > W + 30) Object.assign(p, mk(false));
    x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.scale(1, .55 + .45 * Math.abs(Math.sin(p.ph))); x.fillStyle = p.c; x.globalAlpha = .9;
    x.beginPath(); x.moveTo(0, -p.s); x.bezierCurveTo(p.s * .9, -p.s * .6, p.s * .7, p.s * .7, 0, p.s); x.bezierCurveTo(-p.s * .7, p.s * .7, -p.s * .9, -p.s * .6, 0, -p.s); x.fill(); x.restore();
  }
  x.globalAlpha = 1;
}
addEventListener('resize', size); size();
(function loop(t) { x.clearRect(0, 0, W, H); frame(t || 0); requestAnimationFrame(loop); })();
</script>
</body>
</html>
