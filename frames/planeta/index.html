<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planeta · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Planeta — xatframe. ?p= colores, ?boton=0 oculta el botón de color */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

</style>
<style>.sig{font:500 9px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:#fff;opacity:.32;mix-blend-mode:difference;pointer-events:none;white-space:nowrap;z-index:55}.sig.fx{position:fixed;left:16px;bottom:12px}.sig.fr{position:fixed;right:56px;bottom:22px;left:auto}.sig.in{position:absolute;left:0;right:0;bottom:-22px;text-align:center}</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const EN = Q.get('lang') ? Q.get('lang') === 'en' : !/^es\b/i.test(navigator.language || 'es'), L = (es, en) => EN ? en : es; document.documentElement.lang = EN ? 'en' : 'es';
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const c = $('#c'), x = c.getContext('2d'); let W = 0, H = 0, DPR = 1;
let P, PK;
const PAL = { rojo: { a: '#ff2a3d', bg: '#060607' }, verde: { a: '#a6ff3a', bg: '#050705' }, azul: { a: '#4da3ff', bg: '#04060a' }, blanco: { a: '#e9e9e9', bg: '#070707' } };
let stars = []; const XP = new Image(); let xpOk = false; XP.addEventListener('load', () => xpOk = true); XP.addEventListener('error', () => { if (!XP.dataset.f) { XP.dataset.f = 1; XP.src = 'https://xat.com/content/web/R00262/img/xatplanet.svg'; } }); XP.src = 'https://xat.com/content/web/R00261/img/xatplanet.svg';
function rsHook() { stars = Array.from({ length: Math.round(W * H / 6000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() < .9 ? .8 : 1.6, p: Math.random() * TAU })); }
function sphere(cx, cy, r, rim) {
  let g = x.createRadialGradient(cx - r * .35, cy - r * .4, r * .1, cx, cy, r); g.addColorStop(0, '#3a3d44'); g.addColorStop(.6, '#15171b'); g.addColorStop(1, '#050506'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  x.save(); x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.clip(); x.strokeStyle = 'rgba(255,255,255,.04)'; x.lineWidth = r * .06; for (let k = -4; k <= 4; k++) { x.beginPath(); x.ellipse(cx, cy + k * r * .2, r * 1.1, r * .08, -.35, 0, TAU); x.stroke(); } x.restore();
  g = x.createRadialGradient(cx + r * .25, cy + r * .45, r * .6, cx, cy, r * 1.04); g.addColorStop(0, rgba(rim, 0)); g.addColorStop(.92, rgba(rim, .0)); g.addColorStop(.985, rgba(rim, .85)); g.addColorStop(1, rgba(rim, 0)); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r * 1.04, 0, TAU); x.fill();
}
function ring(cx, cy, r, front, t) { x.save(); x.translate(cx, cy); x.rotate(-.38); for (let k = 0; k < 5; k++) { x.strokeStyle = `rgba(200,205,215,${.12 + k * .05})`; x.lineWidth = r * .035; x.beginPath(); x.ellipse(0, 0, r * (1.45 + k * .09), r * (.32 + k * .02), 0, front ? 0 : Math.PI, front ? Math.PI : TAU); x.stroke(); } x.restore(); }
function frame(t) {
  x.fillStyle = P.bg; x.fillRect(0, 0, W, H);
  for (const s of stars) { x.fillStyle = `rgba(255,255,255,${.25 + .35 * (.5 + .5 * Math.sin(t * .8 + s.p))})`; x.fillRect(s.x, s.y, s.r, s.r); }
  const S = Math.max(150, (W - 728) / 2);
  // línea de luz vertical
  for (const lx of [S * .5, W - S * .5]) { const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, rgba(P.a, 0)); g.addColorStop(.5, rgba(P.a, .55)); g.addColorStop(1, rgba(P.a, 0)); x.fillStyle = g; x.fillRect(lx - .75, 0, 1.5, H); }
  // planeta con anillos (izquierda)
  const r1 = Math.min(S * .3, H * .15), c1x = S * .5, c1y = H * .4 + Math.sin(t * .3) * 6;
  if (xpOk) { const w = Math.min(S * .85, 340), h = w * 19 / 37; let gg = x.createRadialGradient(c1x, c1y, 0, c1x, c1y, w * .6); gg.addColorStop(0, rgba(P.a, .22)); gg.addColorStop(1, rgba(P.a, 0)); x.fillStyle = gg; x.fillRect(c1x - w, c1y - w, w * 2, w * 2); x.drawImage(XP, c1x - w / 2, c1y - h / 2, w, h); }
  else { ring(c1x, c1y, r1, false, t); sphere(c1x, c1y, r1, P.a); ring(c1x, c1y, r1, true, t); }
  // eclipse (derecha)
  const r2 = Math.min(S * .28, H * .14), c2x = W - S * .5, c2y = H * .6, gl = .7 + .3 * Math.sin(t * .6);
  let g = x.createRadialGradient(c2x, c2y, r2 * .9, c2x, c2y, r2 * 1.9); g.addColorStop(0, rgba(P.a, .5 * gl)); g.addColorStop(1, rgba(P.a, 0)); x.fillStyle = g; x.beginPath(); x.arc(c2x, c2y, r2 * 1.9, 0, TAU); x.fill();
  x.strokeStyle = rgba(P.a, .95); x.lineWidth = 2; x.beginPath(); x.arc(c2x, c2y, r2, 0, TAU); x.stroke(); x.fillStyle = P.bg; x.beginPath(); x.arc(c2x, c2y, r2 - 1, 0, TAU); x.fill();
  // horizonte de un planeta abajo
  const R = W * 1.4, cy = H + R - H * .1; g = x.createRadialGradient(W / 2, cy, R - 2, W / 2, cy, R + H * .12); g.addColorStop(0, rgba(P.a, .6)); g.addColorStop(.06, rgba(P.a, .18)); g.addColorStop(1, rgba(P.a, 0)); x.fillStyle = g; x.beginPath(); x.arc(W / 2, cy, R + H * .12, 0, TAU); x.fill();
  x.fillStyle = '#020203'; x.beginPath(); x.arc(W / 2, cy, R, 0, TAU); x.fill();
}
function setPal(k) { PK = k; P = PAL[k]; if (typeof palHook === 'function') palHook(); }
const P0 = PAL[Q.get('p')] ? Q.get('p') : 'rojo'; setPal(P0);
function rs() { DPR = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0); if (typeof rsHook === 'function') rsHook(); }
addEventListener('resize', rs); rs();
let last = performance.now();
(function loop(t) { const dt = Math.min(50, t - last) / 1000; last = t; if (!document.hidden) frame(t / 1000, dt); requestAnimationFrame(loop); })(last);
</script>
<script>var SW = { pal: PAL, cur: P0, set: setPal, dots: k => [PAL[k].a, PAL[k].bg, PAL[k].a], names: EN ? {"rojo": "red", "verde": "green", "azul": "blue", "blanco": "white"} : {} };</script>
<button class="swc" id="swc" type="button" aria-label="Cambiar color"><span></span></button><div class="swn" id="swn"></div>
<style>
.swc{position:fixed;right:14px;bottom:14px;z-index:60;width:30px;height:30px;padding:3px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;opacity:.6;transition:opacity .25s,transform .4s}
.swc:hover{opacity:1;transform:rotate(120deg)}
.swc span{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--sw1),var(--sw2),var(--sw3),var(--sw1))}
.swn{position:fixed;right:52px;bottom:19px;z-index:60;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.4);opacity:0;transform:translateX(6px);transition:all .3s;pointer-events:none}
.swn.on{opacity:1;transform:none}
</style>
<script>
/* botón de color: cada visitante puede cambiar los colores solo en su pantalla (no se guarda nada) */
(function () {
  const Q = new URLSearchParams(location.search), b = document.getElementById('swc'), n = document.getElementById('swn');
  if (Q.get('boton') === '0') { b.remove(); n.remove(); return; }
  const L = Object.keys(SW.pal); let i = Math.max(0, L.indexOf(SW.cur)), t;
  const dot = k => { const c = SW.dots(k);['--sw1', '--sw2', '--sw3'].forEach((v, j) => b.style.setProperty(v, c[j % c.length])); };
  dot(L[(i + 1) % L.length]);
  b.addEventListener('click', e => {
    e.stopPropagation(); i = (i + 1) % L.length; SW.set(L[i]); dot(L[(i + 1) % L.length]);
    n.textContent = SW.names && SW.names[L[i]] || L[i]; n.classList.add('on'); clearTimeout(t); t = setTimeout(() => n.classList.remove('on'), 1400);
  });
  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
})();
</script>
<div class="sig fx">xHaz Frame Design</div>
</body>
</html>
