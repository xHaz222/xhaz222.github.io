<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruleta de la sala · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Ruleta de la sala — xatframe
   Link:  ?u=usuario1,usuario2,usuario3&modo=reto|sorteo&r=reto 1|reto 2&c=azul|ambar|menta
   u = registros de xat de tu sala (hasta 16). Sin usuarios: ruleta de powers de xat */
*{margin:0;padding:0;box-sizing:border-box}
:root{--a:#7aa2ff;--b:#b388ff;--bg1:#0a0b10;--bg2:#141725}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg1);color:#e8f6ff;font-family:'Rajdhani',system-ui,sans-serif;user-select:none;-webkit-user-select:none}
.bg{position:fixed;inset:0;background:radial-gradient(60% 50% at 85% 50%,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%),radial-gradient(50% 45% at 12% 55%,color-mix(in srgb,var(--b) 10%,transparent),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2))}
.hex{position:fixed;inset:-60px;opacity:.05;background-image:repeating-linear-gradient(60deg,#fff 0 1px,transparent 1px 28px),repeating-linear-gradient(-60deg,#fff 0 1px,transparent 1px 28px),repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 48.5px);animation:drift 40s linear infinite}
@keyframes drift{to{transform:translate(56px,97px)}}
.scan{display:none}
.side{position:fixed;top:50%;transform:translateY(-50%);width:min(22vw,330px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.side.l{left:2vw}.side.r{right:2vw}
.hd{font-family:'Orbitron',sans-serif;font-weight:600;font-size:clamp(10px,.85vw,13px);letter-spacing:.35em;color:color-mix(in srgb,var(--a) 85%,#fff)}
.list{width:100%;display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:hidden}
.pl{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(6px);font-weight:700;font-size:clamp(13px,1.1vw,17px);transition:all .3s}
.pl img,.pl i{width:28px;height:28px;border-radius:50%;object-fit:cover;flex:none;border:1.5px solid color-mix(in srgb,var(--a) 70%,transparent);background:#1c2133;display:grid;place-items:center;font-style:normal;font-size:13px;color:#fff}
.pl.win{background:color-mix(in srgb,var(--a) 18%,transparent);border-color:color-mix(in srgb,var(--a) 70%,transparent)}
.wheelbox{position:relative;width:min(20vw,300px);aspect-ratio:1}
#wheel{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid #f2f4fa;filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
.hub{position:absolute;inset:41%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2a3045,#0e1018);border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;font-family:'Orbitron';font-size:clamp(9px,.8vw,12px);color:var(--a);letter-spacing:.1em}
/* franja clickeable (debajo del banner del chat) */
.bar{position:fixed;left:0;right:0;bottom:0;height:min(22vh,170px);display:flex;align-items:center;justify-content:center;gap:16px;padding:0 3vw}
.go{font-family:'Orbitron',sans-serif;font-weight:600;font-size:clamp(13px,1.2vw,17px);letter-spacing:.28em;color:#0a0b10;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 90%,#fff),var(--b));border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--a) 30%,transparent);transition:transform .2s}
.go:hover{transform:translateY(-2px) scale(1.03)}.go:disabled{opacity:.5;cursor:default;transform:none}
.res{display:flex;align-items:center;gap:12px;min-width:0;opacity:0;transform:translateY(10px);transition:all .4s}
.res.on{opacity:1;transform:none}
.res img,.res i{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid color-mix(in srgb,var(--a) 80%,#fff);box-shadow:0 8px 20px rgba(0,0,0,.4);flex:none;background:#1a2250;display:grid;place-items:center;font-style:normal;font-size:24px;font-weight:700;color:#fff}
.res b{display:block;font-family:'Orbitron';font-weight:600;letter-spacing:.06em;font-size:clamp(14px,1.3vw,19px);color:#fff}
.res span{display:block;font-size:clamp(14px,1.2vw,18px);color:#cfe9ff;max-width:44vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:700px){.side.l{display:none}.side.r{right:50%;transform:translate(50%,-62%);width:60vw}.wheelbox{width:46vw}}
.cap{text-transform:capitalize}
.nw{color:var(--a)}
.pwi{border-radius:8px;background:#1c2133;padding:3px}
</style>
<style>.sig{font:500 9px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:#fff;opacity:.32;mix-blend-mode:difference;pointer-events:none;white-space:nowrap;z-index:55}.sig.fx{position:fixed;left:16px;bottom:12px}.sig.fr{position:fixed;right:56px;bottom:22px;left:auto}.sig.in{position:absolute;left:0;right:0;bottom:-22px;text-align:center}</style>
</head>
<body>
<div class="bg"></div><div class="hex"></div><div class="scan"></div>
<div class="side l"><div class="hd">JUGADORES</div><div class="list" id="list"></div></div>
<div class="side r"><div class="hd" id="mode">RULETA</div><div class="wheelbox"><div class="ptr"></div><canvas id="wheel"></canvas><div class="hub">SALA</div></div></div>
<div class="bar"><button class="go" id="go" type="button">GIRAR</button><div class="res" id="res"></div></div>
<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const EN = Q.get('lang') ? Q.get('lang') === 'en' : !/^es\b/i.test(navigator.language || 'es'), L = (es, en) => EN ? en : es; document.documentElement.lang = EN ? 'en' : 'es';
document.addEventListener('error', e => { const t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.fb) return; const f = t.dataset.fb; if (f === 'hide') t.style.display = 'none'; else if (f === 'rmp') { if (t.parentElement) t.parentElement.remove(); } else if (f === 'ini') { const n = document.createElement(t.dataset.tag || 'div'); if (n.tagName === 'DIV') n.className = 'ini'; n.textContent = t.dataset.ini || '?'; t.replaceWith(n); } }, true);
if (EN) { document.querySelector('.side.l .hd').textContent = 'PLAYERS'; document.querySelector('.hub').textContent = 'ROOM'; document.getElementById('go').textContent = 'SPIN'; }

const cleanNick = n => String(n || '').replace(/\([^)]*\)/g, '').trim().slice(0, 20);
const THEMES = { azul: ['#7aa2ff', '#b388ff'], ambar: ['#ffb86b', '#ff7a8a'], menta: ['#6ee7c8', '#7aa2ff'] };
let th; function setTh(k) { th = THEMES[k]; document.documentElement.style.setProperty('--a', th[0]); document.documentElement.style.setProperty('--b', th[1]); try { draw(); } catch (e) { } }
const T0 = THEMES[Q.get('c')] ? Q.get('c') : 'azul'; setTh(T0);
let users = (Q.get('u') || '').split(',').map(s => s.trim()).filter(s => /^[A-Za-z0-9_.\-]{1,30}$/.test(s)).slice(0, 16);
const demo = users.length < 2;
const MODE = ['sorteo', 'reto'].includes(Q.get('modo')) ? Q.get('modo') : (Q.get('u') ? 'reto' : 'powers');
const RETOS = (Q.get('r') ? Q.get('r').split('|') : (EN ? ['Tell a joke', 'Share your favorite song', 'Chat only in smileys for 2 minutes', 'Say something nice to someone in the room', 'Tell a funny story', 'Share a fun fact', 'Pick a smiley that represents you', 'Recommend a movie or series'] : ['Cuenta un chiste', 'Di tu canción favorita', 'Escribe solo con smileys por 2 minutos', 'Dile algo bonito a alguien de la sala', 'Cuenta una anécdota graciosa', 'Di un dato curioso', 'Elige un smiley que te represente', 'Recomienda una película o serie'])).map(s => s.trim().slice(0, 60)).filter(Boolean);
$('#mode').textContent = MODE === 'sorteo' ? L('SORTEO', 'GIVEAWAY') : MODE === 'powers' ? L('RULETA DE POWERS', 'POWER WHEEL') : L('RULETA DE RETOS', 'DARE WHEEL');
if (demo) { document.querySelector('.side.l .hd').textContent = MODE === 'sorteo' ? L('NÚMEROS', 'NUMBERS') : MODE === 'powers' ? L('POWERS EN JUEGO', 'POWERS IN PLAY') : L('RETOS', 'DARES'); }
const info = demo && MODE === 'powers' ? [] : demo ? (MODE === 'sorteo' ? Array.from({ length: 10 }, (_, i) => ({ u: '', nick: String(i + 1) })) : RETOS.slice(0, 10).map(t => ({ u: '', nick: t, reto: true }))) : users.map(u => ({ u, nick: u }));
function lookup(i) {
  if (demo) return Promise.resolve();
  return fetch('https://xat.com/web_gear/chat/profile2.php?n=' + encodeURIComponent(info[i].u)).then(r => r.json()).then(j => {
    const m = (j && j.Err && j.Err.Media) || {}; if (!m.id) return; const av = String(m.avatar || '').split('#')[0];
    Object.assign(info[i], { nick: cleanNick(m.nick) || m.Name || info[i].u, avatar: /^https:\/\//.test(av) ? av : '', id: m.id }); renderList(); draw();
  }).catch(() => { });
}
const E = (t, cls, txt) => { const n = document.createElement(t); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
function pic(src, cls, ini) { const m = new Image(); m.alt = ''; if (cls) m.className = cls; if (ini) { m.dataset.fb = 'ini'; m.dataset.tag = 'i'; m.dataset.ini = ini; } m.src = src; return m; }
const face = d => d.pw ? pic(`https://xat.com/images/smw/${d.nick}.png`, 'pwi') : d.reto ? E('i', '', '✦') : d.avatar ? pic(d.avatar, '', d.nick[0].toUpperCase()) : E('i', '', d.nick[0].toUpperCase());
function renderList(win) { const l = $('#list'); l.textContent = ''; info.forEach((d, i) => { const row = E('div', 'pl' + (i === win ? ' win' : '')); row.appendChild(d.reto || (demo && MODE === 'sorteo') ? E('i', '', d.reto ? i + 1 : d.nick) : face(d)); const sp = E('span', '', d.nick); if (d.jack) { sp.append(' '); sp.appendChild(E('small', 'nw', L('★ NUEVO', '★ NEW'))); } row.appendChild(sp); l.appendChild(row); }); }

/* rueda */
const cv = $('#wheel'), x = cv.getContext('2d'); let ang = 0; const IMG = [];
function size() { const r = cv.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); cv.width = r.width * d; cv.height = r.height * d; draw(); }
function draw() {
  const W = cv.width, R = W / 2 - 4, n = info.length, seg = Math.PI * 2 / n; x.clearRect(0, 0, W, W); if (!n) return;
  x.save(); x.translate(W / 2, W / 2); x.rotate(ang);
  for (let i = 0; i < n; i++) {
    x.beginPath(); x.moveTo(0, 0); x.arc(0, 0, R, i * seg - Math.PI / 2, (i + 1) * seg - Math.PI / 2); x.closePath();
    const gg = x.createRadialGradient(0, 0, R * .2, 0, 0, R); gg.addColorStop(0, i % 2 ? '#1b2033' : '#232a40'); gg.addColorStop(1, i % 2 ? '#12151f' : '#181c2a'); x.fillStyle = gg; x.fill(); x.strokeStyle = 'rgba(255,255,255,.12)'; x.lineWidth = W / 300; x.stroke();
    x.beginPath(); x.arc(0, 0, R - W / 70, i * seg - Math.PI / 2 + .02, (i + 1) * seg - Math.PI / 2 - .02); x.strokeStyle = th[i % 2]; x.lineWidth = W / 90; x.stroke();
    x.save(); x.rotate((i + .5) * seg - Math.PI / 2); x.fillStyle = '#e8f6ff'; x.font = `700 ${Math.max(10, W / (n > 10 ? 26 : 18))}px Rajdhani,sans-serif`; x.textAlign = 'right'; x.textBaseline = 'middle';
    if (info[i].pw && IMG[i] && IMG[i].complete && IMG[i].naturalWidth) { const s = Math.max(16, W / 12); x.rotate(Math.PI / 2); x.drawImage(IMG[i], -s / 2, -(R - W / 26) , s, s); } else x.fillText(info[i].reto ? String(i + 1) : info[i].nick.slice(0, 12), R - W / 26, 0);
    x.restore();
  }
  x.beginPath(); x.arc(0, 0, R, 0, 6.283); x.strokeStyle = 'rgba(255,255,255,.35)'; x.lineWidth = W / 220; x.stroke();
  x.restore();
}
/* tick */
let AC; function tick(f, v) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain(); o.type = 'square'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + .05); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + .06); } catch (e) { } }
let spinning = false, lastSeg = -1;
$('#go').addEventListener('click', () => {
  if (spinning) return; spinning = true; $('#go').disabled = true; $('#res').classList.remove('on'); renderList();
  const n = info.length; if (!n) { spinning = false; $('#go').disabled = false; return; } const seg = Math.PI * 2 / n, win = Math.random() * n | 0;
  const target = Math.PI * 2 * (5 + Math.random() * 2) + (Math.PI * 2 - (win + .5) * seg) - (ang % (Math.PI * 2)) + (Math.random() - .5) * seg * .6;
  const a0 = ang, t0 = performance.now(), dur = 4200;
  function step(t) {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3.4); ang = a0 + target * e; draw();
    const cur = Math.floor((((-ang) % (Math.PI * 2)) + Math.PI * 4) % (Math.PI * 2) / seg); if (cur !== lastSeg) { lastSeg = cur; tick(900, .04); }
    if (k < 1) return requestAnimationFrame(step);
    spinning = false; $('#go').disabled = false; const d = info[win]; renderList(win); tick(1400, .08); setTimeout(() => tick(1900, .08), 120);
    const r = $('#res'); r.textContent = ''; if (demo && MODE === 'sorteo') { const n = document.createElement('i'); n.textContent = d.nick; r.appendChild(n); } else { r.appendChild(face(d)); } const box = document.createElement('div'), bb = document.createElement('b'), sp = document.createElement('span'); if (d.pw) bb.className = 'cap'; bb.textContent = d.reto ? `${L('Reto ', 'Dare ')}${win + 1}: ${d.nick}` : d.nick; sp.textContent = d.pw ? (d.jack ? L('★ ¡El power más nuevo de xat! ', '★ The newest xat power! ') : L('Tu power de la suerte · ', 'Your lucky power · ')) + d.sm.map(c => `(${c})`).join(' ') : d.reto ? L('Le toca a quien escribió último en la sala', 'Whoever chatted last has to do it') : MODE === 'sorteo' ? (demo ? L('¡Salió este número!', 'This number came up!') : L('¡Ganó el sorteo! 🎉', 'Won the giveaway! 🎉')) : RETOS[Math.random() * RETOS.length | 0]; box.append(bb, sp); r.appendChild(box);
    $('#res').classList.add('on');
  }
step(t0);
});
addEventListener('resize', size);
function loadPowers() {
  Promise.all([fetch('https://xat.com/json/powers.php').then(r => r.json()), fetch('https://xat.com/web_gear/chat/pow2.php').then(r => r.json())]).then(([p, a]) => {
    const topsh = (a.find(x => x[0] === 'topsh') || [])[1] || {}, last = ((a.find(x => x[0] === 'last') || [])[1] || {}).id, sm = {};
    for (const [code, id] of Object.entries(topsh)) (sm[id] = sm[id] || []).push(code);
    const list = Object.entries(p).map(([id, v]) => ({ id: +id, nick: v.s, sm: (sm[id] || []).slice(0, 3), pw: true })).filter(v => v.nick && /^[a-z0-9]+$/.test(v.nick) && v.sm.length);
    const newest = list.find(v => v.id == last), pick = [];
    if (newest) pick.push(Object.assign({ jack: true }, newest));
    while (pick.length < 10 && pick.length < list.length) { const v = list[Math.random() * list.length | 0]; if (!pick.some(q => q.id === v.id)) pick.push(v); }
    pick.sort(() => Math.random() - .5); info.push(...pick);
    info.forEach((d, i) => { const im = new Image(); im.addEventListener('load', draw); im.src = 'https://xat.com/images/smw/' + d.nick + '.png'; IMG[i] = im; });
    renderList(); draw(); $('#go').disabled = false;
  }).catch(() => { $('#mode').textContent = L('SIN CONEXIÓN CON XAT', 'NO CONNECTION TO XAT'); });
}
if (MODE === 'powers' && demo) { $('#go').disabled = true; loadPowers(); }
renderList(); size(); info.forEach((_, i) => lookup(i));
</script>
<script>var SW = { pal: THEMES, cur: T0, set: setTh, dots: k => [THEMES[k][0], THEMES[k][1], THEMES[k][0]], names: EN ? { azul: 'blue', ambar: 'amber', menta: 'mint' } : { ambar: 'ámbar' } };</script>
<button class="swc" id="swc" type="button" aria-label="Cambiar color"><span></span></button><div class="swn" id="swn"></div>
<style>
.swc{position:fixed;right:14px;bottom:14px;z-index:60;width:30px;height:30px;padding:3px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;opacity:.6;transition:opacity .25s,transform .4s}
.swc:hover{opacity:1;transform:rotate(120deg)}
.swc span{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--sw1),var(--sw2),var(--sw3),var(--sw1))}
.swn{position:fixed;right:52px;bottom:19px;z-index:60;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.4);opacity:0;transform:translateX(6px);transition:all .3s;pointer-events:none}
.swn.on{opacity:1;transform:none}
</style>
<script>
/* botón de color: cada visitante puede cambiar los colores solo en su pantalla (no se guarda nada) */
function swInit() {
  const Q = new URLSearchParams(location.search), b = document.getElementById('swc'), n = document.getElementById('swn');
  if (Q.get('boton') === '0') { b.remove(); n.remove(); return; }
  const L = Object.keys(SW.pal); let i = Math.max(0, L.indexOf(SW.cur)), t;
  const dot = k => { const c = SW.dots(k);['--sw1', '--sw2', '--sw3'].forEach((v, j) => b.style.setProperty(v, c[j % c.length])); };
  dot(L[(i + 1) % L.length]);
  b.addEventListener('click', e => {
    e.stopPropagation(); i = (i + 1) % L.length; SW.set(L[i]); dot(L[(i + 1) % L.length]);
    n.textContent = SW.names && SW.names[L[i]] || L[i]; n.classList.add('on'); clearTimeout(t); t = setTimeout(() => n.classList.remove('on'), 1400);
  });
  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
}
swInit();
</script>
<div class="sig fx">xHaz Frame Design</div>
</body>
</html>
