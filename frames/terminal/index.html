<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal · xatframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Terminal — xatframe. ?p= colores, ?boton=0 oculta el botón de color */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}

</style>
<style>.sig{font:500 9px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.16em;color:#fff;opacity:.32;mix-blend-mode:difference;pointer-events:none;white-space:nowrap;z-index:55}.sig.fx{position:fixed;left:16px;bottom:12px}.sig.fr{position:fixed;right:56px;bottom:22px;left:auto}.sig.in{position:absolute;left:0;right:0;bottom:-22px;text-align:center}</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const Q = new URLSearchParams(location.search), $ = s => document.querySelector(s);
const EN = Q.get('lang') ? Q.get('lang') === 'en' : !/^es\b/i.test(navigator.language || 'es'), L = (es, en) => EN ? en : es; document.documentElement.lang = EN ? 'en' : 'es';
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a);
const rgb = h => { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; };
const rgba = (h, a) => { const [r, g, b] = rgb(h); return `rgba(${r},${g},${b},${a})`; };
const c = $('#c'), x = c.getContext('2d'); let W = 0, H = 0, DPR = 1;
let P, PK;
const PAL = { verde: { bg: '#020a04', c: '#39ff7a' }, ambar: { bg: '#0a0602', c: '#ffb000' }, cian: { bg: '#02080b', c: '#3ee6ff' }, blanco: { bg: '#08090b', c: '#e8ecf2' } };
const CH = '0123456789ABCDEF{}[]<>/=+*#$%&'.split(''), WORDS = ['(smile)', '(cool)', '(wink)', '(d)', '(xat)', '(hug)', '(star)'];
const LINES = EN ? ['> connecting to xat...', '> room ready', '> loading smileys (smile)(cool)(wink)', '> users online ✓', '> all good'] : ['> conectando con xat...', '> sala lista', '> cargando smileys (smile)(cool)(wink)', '> usuarios en línea ✓', '> todo en orden'];
let cols = [], fs = 15, li = 0, ci = 0, tl = 0, done = [];
function rsHook() {
  fs = Math.max(13, Math.round(W / 110)); cols = []; const n = Math.floor(W * .24 / fs);
  for (let i = 0; i < n; i++) for (const sd of [0, 1]) cols.push({ x: sd ? W - (i + 1) * fs : i * fs, y: Math.random() * H, v: rnd(30, 90), w: Math.random() < .08 ? WORDS[Math.random() * WORDS.length | 0] : null });
  x.fillStyle = P.bg; x.fillRect(0, 0, W, H);
}
function palHook() { if (W) { x.fillStyle = P.bg; x.fillRect(0, 0, W, H); } }
function frame(t, dt) {
  x.fillStyle = rgba(P.bg, .14); x.fillRect(0, 0, W, H);
  x.font = `500 ${fs}px 'JetBrains Mono', monospace`; x.textAlign = 'center';
  for (const k of cols) {
    k.y += k.v * dt; if (k.y > H + fs * 8) { k.y = -fs * 4; k.v = rnd(30, 90); k.w = Math.random() < .08 ? WORDS[Math.random() * WORDS.length | 0] : null; }
    x.fillStyle = rgba(P.c, .9); const ch = k.w ? k.w[Math.floor(k.y / fs) % k.w.length] : CH[(Math.random() * CH.length) | 0];
    x.fillText(ch, k.x + fs / 2, k.y); x.fillStyle = rgba(P.c, .25); x.fillText(CH[(Math.random() * CH.length) | 0], k.x + fs / 2, k.y - fs * 3);
  }
  tl += dt; if (tl > .06) { tl = 0; ci++; if (ci > LINES[li].length + 22) { done.push(LINES[li]); if (done.length > 3) done.shift(); li = (li + 1) % LINES.length; ci = 0; } }
  const bx = Math.max(16, W * .02), by = H - Math.max(16, H * .03), lh = fs * 1.35; x.textAlign = 'left';
  x.fillStyle = rgba(P.bg, .85); x.fillRect(bx - 10, by - lh * 4.2, Math.min(W * .3, 420), lh * 4.7);
  x.fillStyle = rgba(P.c, .55); done.forEach((d, i) => x.fillText(d, bx, by - lh * (done.length - i)));
  const cur = LINES[li].slice(0, ci); x.fillStyle = P.c; x.fillText(cur, bx, by);
  if (Math.floor(t * 1.6) % 2 === 0) x.fillRect(bx + x.measureText(cur).width + 3, by - fs * .8, fs * .55, fs * .95);
}
function setPal(k) { PK = k; P = PAL[k]; if (typeof palHook === 'function') palHook(); }
const P0 = PAL[Q.get('p')] ? Q.get('p') : 'verde'; setPal(P0);
function rs() { DPR = Math.min(window.devicePixelRatio || 1, 1.5); W = innerWidth; H = innerHeight; c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); x.setTransform(DPR, 0, 0, DPR, 0, 0); if (typeof rsHook === 'function') rsHook(); }
addEventListener('resize', rs); rs();
let last = performance.now();
(function loop(t) { const dt = Math.min(50, t - last) / 1000; last = t; if (!document.hidden) frame(t / 1000, dt); requestAnimationFrame(loop); })(last);
</script>
<script>var SW = { pal: PAL, cur: P0, set: setPal, dots: k => [PAL[k].c, PAL[k].bg, PAL[k].c], names: EN ? {"verde": "green", "ambar": "amber", "cian": "cyan", "blanco": "white"} : {"ambar": "ámbar"} };</script>
<button class="swc" id="swc" type="button" aria-label="Cambiar color"><span></span></button><div class="swn" id="swn"></div>
<style>
.swc{position:fixed;right:14px;bottom:14px;z-index:60;width:30px;height:30px;padding:3px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer;opacity:.6;transition:opacity .25s,transform .4s}
.swc:hover{opacity:1;transform:rotate(120deg)}
.swc span{display:block;width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--sw1),var(--sw2),var(--sw3),var(--sw1))}
.swn{position:fixed;right:52px;bottom:19px;z-index:60;font:500 10px/1 'JetBrains Mono',ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:#fff;padding:5px 9px;border-radius:999px;background:rgba(0,0,0,.4);opacity:0;transform:translateX(6px);transition:all .3s;pointer-events:none}
.swn.on{opacity:1;transform:none}
</style>
<script>
/* botón de color: cada visitante puede cambiar los colores solo en su pantalla (no se guarda nada) */
(function () {
  const Q = new URLSearchParams(location.search), b = document.getElementById('swc'), n = document.getElementById('swn');
  if (Q.get('boton') === '0') { b.remove(); n.remove(); return; }
  const L = Object.keys(SW.pal); let i = Math.max(0, L.indexOf(SW.cur)), t;
  const dot = k => { const c = SW.dots(k);['--sw1', '--sw2', '--sw3'].forEach((v, j) => b.style.setProperty(v, c[j % c.length])); };
  dot(L[(i + 1) % L.length]);
  b.addEventListener('click', e => {
    e.stopPropagation(); i = (i + 1) % L.length; SW.set(L[i]); dot(L[(i + 1) % L.length]);
    n.textContent = SW.names && SW.names[L[i]] || L[i]; n.classList.add('on'); clearTimeout(t); t = setTimeout(() => n.classList.remove('on'), 1400);
  });
  ['pointerdown', 'mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => e.stopPropagation()));
})();
</script>
<div class="sig fr">xHaz Frame Design</div>
</body>
</html>
